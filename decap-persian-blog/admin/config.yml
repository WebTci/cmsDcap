backend:
  name: git-gateway
  branch: main

# مسیر ذخیره تصاویر در مخزن و مسیر دسترسی عمومی به آن‌ها
media_folder: "images/uploads"
public_folder: "/images/uploads"

# زبان فارسی در Decap CMS پشتیبانی می‌شود.
locale: "fa"

# فایل‌ها مستقیماً در content/blog/<slug>.md ذخیره می‌شوند.
collections:
  - name: "blog"
    label: "مقالات"
    label_singular: "مقاله"
    folder: "content/blog"
    create: true
    delete: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: "عنوان"
        name: "title"
        widget: "string"
        required: true
      - label: "تاریخ انتشار"
        name: "date"
        widget: "datetime"
        required: true
        format: "YYYY-MM-DDTHH:mm:ssZ"
      - label: "تصویر شاخص"
        name: "cover"
        widget: "image"
        required: false
      - label: "خلاصه"
        name: "excerpt"
        widget: "text"
        required: false
      - label: "متن مقاله"
        name: "body"
        widget: "markdown"
        required: true
